<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | بصمة غير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style>
:root{
  --bg:#f2f3f7; --surface:#fff; --ink:#141821; --muted:#67707f; --line:#e6e8ee;
  --brand:#b0722a; --brand2:#8f5820; --brand-soft:#faf3e9;
  --ok:#15803d; --ok-soft:#e9f7ef; --bad:#dc2626; --bad-soft:#fdecea; --info:#2563eb;
  --r:14px; --sh:0 1px 2px rgba(20,24,33,.05),0 10px 28px rgba(20,24,33,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:.86rem;background:#fbfbfd;outline:none;color:var(--ink);transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(176,114,42,.13)}
textarea{resize:vertical}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c9ccd6;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:grid;place-items:center;background:
  radial-gradient(700px 400px at 90% -10%, rgba(176,114,42,.14), transparent 60%),
  radial-gradient(600px 400px at -10% 110%, rgba(176,114,42,.10), transparent 60%), var(--bg);padding:20px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:34px 30px;width:100%;max-width:410px;text-align:center}
.login-mark{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(145deg,#c98a3a,#8f5820);display:grid;place-items:center;color:#fff;font-size:1.7rem;font-weight:700;box-shadow:0 12px 28px rgba(176,114,42,.35)}
.login-card h2{font-size:1.2rem;margin-bottom:4px}
.login-card>p{color:var(--muted);font-size:.82rem;margin-bottom:22px}
.login-card .fld{text-align:right;margin-bottom:12px}
.login-btn{width:100%;margin-top:6px}
.login-note{display:block;margin-top:14px;font-size:.68rem;color:var(--muted)}

/* ===== LAYOUT ===== */
.layout{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
aside.side{background:#12141b;color:#cfd3dd;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px}
.side-brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#c98a3a,#8f5820);display:grid;place-items:center;font-weight:700;color:#fff;font-size:1.1rem;flex-shrink:0}
.side-brand b{display:block;font-size:.92rem;color:#fff}
.side-brand small{font-size:.64rem;color:#8d94a3;letter-spacing:.04em}
#sideNav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;padding-left:2px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;color:#aab0bd;background:transparent;font-size:.84rem;font-weight:600;border:none;transition:.18s;text-align:right}
.nav-btn i{width:18px;text-align:center;font-size:.88rem}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn.active{background:linear-gradient(135deg,#c98a3a,#a0661f);color:#fff;box-shadow:0 6px 18px rgba(176,114,42,.35)}
.nav-btn .tag{margin-right:auto;font-size:.62rem;background:rgba(255,255,255,.1);padding:1px 8px;border-radius:99px}
.nav-btn.active .tag{background:rgba(255,255,255,.22)}
.side-foot{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.side-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#cfd3dd;font-size:.82rem;font-weight:600;transition:.18s}
.side-btn:hover{background:rgba(255,255,255,.07)}
.side-btn.danger{color:#ff9c9c;border-color:rgba(255,120,120,.25)}
.side-btn.danger:hover{background:rgba(255,80,80,.12)}

main.main{padding:22px 26px 60px;min-width:0}
.main-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.main-head h2{font-size:1.25rem;letter-spacing:-.01em}
.main-head p{color:var(--muted);font-size:.8rem}
.db-badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:.72rem;font-weight:600;color:var(--muted);box-shadow:var(--sh)}
.db-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(21,128,61,.15);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(21,128,61,.05)}}

/* ===== COMPONENTS ===== */
.panel{display:none}
.panel.active{display:block;animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{font-size:.95rem;display:flex;align-items:center;gap:9px}
.card-head h3 i{color:var(--brand);font-size:.9rem}
.card-head small{color:var(--muted);font-size:.72rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:.73rem;font-weight:600;color:var(--muted)}
.hint{font-size:.72rem;color:var(--muted);background:var(--brand-soft);border:1px solid #efe2cd;border-radius:10px;padding:9px 12px;margin-top:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:.84rem;transition:.18s}
.btn:hover{background:var(--brand2);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand2);background:var(--brand-soft)}
.btn.red{background:var(--bad)}.btn.red:hover{background:#b91c1c}
.btn.green{background:var(--ok)}.btn.green:hover{background:#166534}
.btn.sm{padding:7px 13px;font-size:.75rem;border-radius:9px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;align-items:center;gap:14px}
.stat .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:1.15rem;flex-shrink:0}
.stat b{font-size:1.35rem;line-height:1.1;display:block}
.stat span{font-size:.72rem;color:var(--muted);font-weight:600}

.acc{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.acc-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;font-weight:700;font-size:.87rem;gap:10px;user-select:none}
.acc-head:hover{background:var(--brand-soft)}
.acc-head .cnt{font-size:.7rem;color:var(--muted);background:var(--bg);border-radius:99px;padding:2px 10px;font-weight:700}
.acc-head .arr{transition:.25s;color:var(--muted);font-size:.75rem}
.acc.open .acc-head .arr{transform:rotate(180deg)}
.acc-body{display:none;padding:14px;border-top:1px solid var(--line);background:#fcfbf8}
.acc.open>.acc-body{display:block}

.imgs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.img-chip{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.img-chip img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.img-chip .x{position:absolute;top:3px;right:3px;background:var(--bad);color:#fff;border:none;width:20px;height:20px;border-radius:50%;font-size:.6rem;display:grid;place-items:center;cursor:pointer;z-index:2}
.img-chip .lbl{position:absolute;bottom:0;right:0;left:0;background:rgba(20,24,33,.75);color:#fff;font-size:.58rem;text-align:center;padding:2px;border:none;cursor:pointer}

.prod-card{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff;flex-wrap:wrap}
.prod-thumb{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#f1efe9;cursor:zoom-in;flex-shrink:0}
.prod-fields{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
.prod-fields input,.prod-fields textarea{font-size:.8rem;padding:8px 10px}
.prod-row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:640px){.prod-row3{grid-template-columns:1fr 1fr}}

.switch{position:relative;width:50px;height:28px;flex-shrink:0;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cbd0da;border-radius:99px;transition:.25s;cursor:pointer}
.switch span:before{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.switch input:checked + span{background:var(--ok)}
.switch input:checked + span:before{transform:translateX(-22px)}

.status-band{display:flex;justify-content:space-between;align-items:center;gap:14px;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);flex-wrap:wrap}
.status-band.open{background:var(--ok-soft);border-color:#bfe6cd}
.status-band.closed{background:var(--bad-soft);border-color:#f5c6cb}
.status-band b{font-size:.92rem}
.status-band small{display:block;color:#667;font-size:.73rem}

.link-card{display:flex;flex-direction:column;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.link-card img{width:64px;height:64px;object-fit:contain;border-radius:10px;border:1px solid var(--line);align-self:center;background:#faf9f6;padding:6px}
.day-card{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;background:#fff}
.day-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.88rem;margin-bottom:9px}
.time-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.time-row input[type=time]{width:auto}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);flex-shrink:0}
.add-box{background:var(--brand-soft);border:1px dashed var(--brand);border-radius:12px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:9px}
.add-box.green{background:var(--ok-soft);border-color:var(--ok)}
.add-box label{font-size:.76rem;font-weight:700}
.mono{font-family:Consolas,monospace;direction:ltr;text-align:left;font-size:.78rem}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:.82rem;background:#faf9f6;border:1px dashed var(--line);border-radius:12px}
.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#12141b;color:#fff;padding:11px 22px;border-radius:99px;display:none;z-index:9999;font-size:.83rem;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.3);opacity:0;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#14532d}.toast.err{background:#7f1d1d}
.refresh-bar{position:fixed;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,transparent,var(--brand),transparent);transform:scaleX(0);transform-origin:right;z-index:9998;transition:transform .3s ease}
.refresh-bar.show{animation:loadBar 1s infinite}
@keyframes loadBar{0%{transform:scaleX(0)}60%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
.lightbox{display:none;position:fixed;inset:0;background:rgba(10,12,16,.95);z-index:10000;justify-content:center;align-items:center;cursor:zoom-out}
.lightbox img{max-width:92%;max-height:92%;border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.lightbox .close{position:absolute;top:16px;right:20px;color:#fff;font-size:1.6rem;background:rgba(255,255,255,.1);border:none;width:44px;height:44px;border-radius:50%}

@media(max-width:960px){
  .layout{grid-template-columns:1fr}
  aside.side{position:sticky;top:0;height:auto;z-index:50;flex-direction:row;align-items:center;gap:8px;padding:10px}
  .side-brand{border:none;padding:0 6px;margin:0}
  .side-brand div{display:none}
  #sideNav{flex-direction:row;overflow-x:auto;flex:1;padding:0}
  .nav-btn{width:auto;white-space:nowrap;padding:8px 12px;font-size:.76rem}
  .side-foot{flex-direction:row;border:none;padding:0;margin:0}
  .side-btn{padding:8px 10px;font-size:.72rem}
  main.main{padding:16px 14px 50px}
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen" class="login-wrap">

</div>

<div id="adminPanel" class="layout" style="display:none">

  <main class="main">

</div>

<div class="refresh-bar" id="refreshBar"></div>
<div id="toastMsg" class="toast"></div>
<div id="lightbox" class="lightbox" onclick="this.style.display='none'"><button class="close"><i class="fas fa-xmark"></i></button><img id="lightboxImg"></div>

function buildShell(){
  const nav = document.getElementById('sideNav');
  const panels = document.getElementById('panels');
  nav.innerHTML = SECTIONS.map(s=>`<button class="nav-btn" id="nav-${s.id}" onclick="showSection('${s.id}')"><i class="${s.icon}"></i> ${s.name}</button>`).join('');
  panels.innerHTML = SECTIONS.map(s=>`<section class="panel" id="panel-${s.id}"><div id="body-${s.id}"></div></section>`).join('');
}
window.showSection = function(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const el = document.getElementById('panel-'+id); if(!el) return;
  el.classList.add('active');
  document.getElementById('nav-'+id).classList.add('active');
  const s = SECTIONS.find(x=>x.id===id);
  document.getElementById('secTitle').innerText = s.name;
  document.getElementById('secDesc').innerText = s.desc;
};

/* ================= AUTH + DATA ================= */
window.doLogin = function(){
  auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
    .then(()=>{ document.getElementById('loginScreen').style.display='none'; document.getElementById('adminPanel').style.display='grid'; })
    .catch(err=>showToast('خطأ في الدخول: '+err.message, true));
};
window.doLogout = function(){ auth.signOut().then(()=>location.reload()); };
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('adminPanel').style.display='grid';
    buildShell();
    showSection('overview');
    loadData();
  }
});

function restoreOpenState(){
  openState.nesteds.forEach(id=>{ const el=document.getElementById('nested-'+id); if(el) el.closest('.acc').classList.add('open'); });
}
window.toggleNested = function(id){
  const el = document.getElementById('nested-'+id);
  if(!el) return;
  const acc = el.closest('.acc');
  const willOpen = !acc.classList.contains('open');
  acc.classList.toggle('open', willOpen);
  if(willOpen) openState.nesteds.add(id); else openState.nesteds.delete(id);
};

function loadData(silent){
  if(silent) flashBar();
  const scroll = window.scrollY;
  db.ref(DB_PATH).once('value', snap=>{
    currentData = snap.val() || {};
    SECTIONS.forEach(s=>{ try{ s.render(); }catch(e){ console.error(s.id, e); } });
    restoreOpenState();
    if(!silent) showSection('overview');
    window.scrollTo(0, scroll);
  }).catch(err=>showToast('خطأ في الاتصال: '+err.message, true));
}

/* ================= 2. IDENTITY ================= */
function idnField(f){
  const v = escA(currentData[f.k] !== undefined && currentData[f.k] !== null ? currentData[f.k] : '');
  const dir = f.dir ? `dir="${f.dir}"` : '';
  const ph = `placeholder="${escA(f.d||'')}"`;
  if(f.type==='page'){
    const sel = ['home','store','works','catalogs','contact'].map(pg=>`<option value="${pg}" ${v===pg?'selected':''}>${PAGE_NAMES[pg]} (#${pg})</option>`).join('');
    return `<div class="fld"><label>${f.p}</label><select id="idn_${f.k}" ${dir}>${sel}</select></div>`;
  }
  if(f.type==='area'){
    const raw = (currentData[f.k]!==undefined&&currentData[f.k]!==null)?String(currentData[f.k]).replace(/&/g,'&amp;').replace(/</g,'&lt;'):'';
    return `<div class="fld ${f.wide?'wide':''}"><label>${f.p}</label><textarea rows="2" id="idn_${f.k}" ${dir} ${ph}>${raw}</textarea></div>`;
  }
  return `<div class="fld ${f.wide?'wide':''}"><label>${f.p}</label><input id="idn_${f.k}" value="${v}" ${dir} ${ph}></div>`;
}
function renderIdentity(){
  const groups = IDENTITY_GROUPS.map(g=>`
    <div class="card">
      <div class="card-head"><h3><i class="${g.icon}"></i> ${g.title}</h3><small>${g.fields.length} حقل</small></div>
      <div class="grid2">${g.fields.map(idnField).join('')}</div>
    </div>`).join('');
  document.getElementById('body-identity').innerHTML = `
    ${groups}
    <div class="btn-row" style="position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 40%);padding:14px 0 6px;margin-top:16px">
      <button class="btn" onclick="saveIdentity()"><i class="fas fa-floppy-disk"></i> حفظ كل النصوص</button>
      <button class="btn ghost" onclick="loadData(true)"><i class="fas fa-rotate"></i> استرجاع المحفوظ</button>
    </div>
    <div class="hint">💡 الحقول الفارغة تظهر في الموقع بالنص الافتراضي المكتوب داخل الحقل (placeholder). <b>كل حرف هنا يظهر في الموقع فوراً.</b></div>`;
}
window.saveIdentity = function(){
  const updates = {};
  IDENTITY_GROUPS.forEach(g=>g.fields.forEach(f=>{
    const el = document.getElementById('idn_'+f.k);
    if(el) updates[f.k] = el.value;
  }));
  db.ref(DB_PATH).update(updates).then(()=>showToast('✅ تم حفظ كل النصوص — الموقع يتحدث فوراً'))
    .catch(()=>showToast('فشل الحفظ', true));
};

window.addBulkExtraLinks = function(){
  const lines = document.getElementById('bulkExtraLinks').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const newLinks=[];
  lines.forEach(line=>{
    const parts = line.split('|');
    if(parts.length>=2) newLinks.push({ platform:parts[0].trim(), url:parts.slice(1).join('|').trim() });
    else if(line.startsWith('http')) newLinks.push({ platform:'رابط', url:line });
  });
  if(!newLinks.length){ showToast('لم يتم العثور على روابط صالحة', true); return; }
  const all=[...(currentData.social_links||[]), ...newLinks];
  db.ref(`${DB_PATH}/social_links`).set(all).then(()=>{ loadData(true); showToast('تمت الإضافة'); });
};
window.removeExtraLink = function(idx){
  const current=currentData.social_links||[]; current.splice(idx,1);
  db.ref(`${DB_PATH}/social_links`).set(current).then(()=>loadData(true));
};
window.saveAllSocial = function(){
  const newLinks=[];
  document.querySelectorAll('#extraLinksList .link-card').forEach((item,i)=>{
    const plat=document.getElementById('extra_plat_'+i), url=document.getElementById('extra_url_'+i);
    if(plat&&url&&plat.value.trim()) newLinks.push({ platform:plat.value.trim(), url:url.value.trim() });
  });
  db.ref(DB_PATH).update({
    insta_url: document.getElementById('instaUrl').value,
    tiktok_url: document.getElementById('tiktokUrl').value,
    snap_url: document.getElementById('snapUrl').value,
    social_links: newLinks
  }).then(()=>{ showToast('✅ تم حفظ جميع الروابط'); loadData(true); });
};

window.updatePartner = function(pid){
  db.ref(`${DB_PATH}/partners/${pid}`).update({
    url: document.getElementById('partnerUrl_'+pid).value.trim(),
    link: document.getElementById('partnerLink_'+pid).value.trim() || null
  }).then(()=>{ showToast('تم الحفظ'); loadData(true); });
};
window.addBulkPartners = function(){
  const lines = document.getElementById('bulkPartners').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const updates={}; let count=0;
  lines.forEach(line=>{
    const parts=line.split('|');
    const imgUrl=parts[0].trim();
    if(!imgUrl.startsWith('http')) return;
    updates[`${DB_PATH}/partners/${Date.now()+'_'+count}`]={ url:imgUrl, link: parts.length>1 ? parts[1].trim() : null };
    count++;
  });
  if(!count){ showToast('لا توجد روابط صالحة', true); return; }
  db.ref().update(updates).then(()=>{ loadData(true); showToast(`تمت إضافة ${count} شريك`); });
};

  const url=document.getElementById('newPartnerUrl').value.trim();

  const link=document.getElementById('newPartnerLink').value.trim();
  db.ref(`${DB_PATH}/partners/${Date.now()}`).set({ url, link: link||null }).then(()=>loadData(true));

function renderSchedule(){
  const sched = currentData.work_schedule||{};
  const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  let html='';
  for(let i=0;i<=6;i++){
    const d = sched[i] || { active:false, s1_s:'09:00', s1_e:'17:00', s2_a:false, s2_s:'', s2_e:'' };
    html += `
    <div class="day-card">
      <div class="day-head"><input type="checkbox" id="dayActive_${i}" ${d.active?'checked':''}> ${days[i]}
        <span style="margin-right:auto"><label class="switch" style="width:42px;height:24px"><input type="checkbox" id="s2a_${i}" ${d.s2_a?'checked':''} onchange="toggleEvening(${i})"><span></span></label></span>
        <small style="color:var(--muted);font-weight:500">مسائي</small></div>
      <div class="time-row"><i class="fas fa-sun" style="color:var(--brand)"></i> <input type="time" id="s1s_${i}" value="${d.s1_s}"> <span>إلى</span> <input type="time" id="s1e_${i}" value="${d.s1_e}"></div>
      <div class="time-row" id="evening_${i}" style="${d.s2_a?'display:flex':'display:none'};margin-top:8px"><i class="fas fa-moon" style="color:#64748b"></i> <input type="time" id="s2s_${i}" value="${d.s2_s}"> <span>إلى</span> <input type="time" id="s2e_${i}" value="${d.s2_e}"></div>
    </div>`;
  }
  document.getElementById('body-schedule').innerHTML = `
    <div class="card">
      <div class="card-head"><h3><i class="fas fa-clock"></i> أوقات العمل الأسبوعية</h3><small>تظهر في تذييل الموقع وصفحة التواصل</small></div>
      ${html}
      <button class="btn" onclick="saveSchedule()"><i class="fas fa-floppy-disk"></i> حفظ أوقات العمل</button>
    </div>`;
}
window.toggleEvening = function(i){ const el=document.getElementById('evening_'+i); if(el) el.style.display = document.getElementById('s2a_'+i).checked ? 'flex':'none'; };
window.saveSchedule = function(){
  const sch={};
  for(let i=0;i<=6;i++){
    sch[i] = {
      active: document.getElementById('dayActive_'+i).checked,
      s1_s: document.getElementById('s1s_'+i).value,
      s1_e: document.getElementById('s1e_'+i).value,
      s2_a: document.getElementById('s2a_'+i).checked,
      s2_s: document.getElementById('s2s_'+i).value,
      s2_e: document.getElementById('s2e_'+i).value
    };
  }
  db.ref(`${DB_PATH}/work_schedule`).set(sch).then(()=>showToast('✅ تم حفظ أوقات العمل'));
};

      <button class="btn" style="margin-top:14px" onclick="saveMaintenance()"><i class="fas fa-floppy-disk"></i> حفظ</button>
    </div>`;
}
window.saveMaintenance = function(){
  const active = document.getElementById('maintenanceMode').checked;
  let until = null;
  if(active){
    const h=parseInt(document.getElementById('hoursInput').value)||0;
    const m=parseInt(document.getElementById('minutesInput').value)||0;
    const s=parseInt(document.getElementById('secondsInput').value)||0;
    const ms=(h*3600+m*60+s)*1000;
    if(ms>0) until = Date.now()+ms;
  }
  db.ref(DB_PATH).update({
    maintenance_mode: active,
    maintenance_title: document.getElementById('maintenanceTitle').value,
    maintenance_message: document.getElementById('maintenanceMsg').value,
    maintenance_until: until
  }).then(()=>{ showToast('✅ تم حفظ وضع الصيانة'); loadData(true); });
};

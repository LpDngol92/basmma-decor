/* CHANEL STORE EXACT — 1:1 replica of chanel.com */
*{margin:0;padding:0;box-sizing:border-box}
:root{--black:#000;--white:#fff;--gray:#767676;--gray-light:#f5f5f5;--line:#e5e5e5;--font-serif:'Cormorant Garamond',serif;--font-sans:'Inter','Cairo',sans-serif}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);background:#fff;color:#000;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:var(--font-sans);cursor:pointer;border:0;background:0}
/* CHANEL HEADER — exact */
.chanel-header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #fff}
.chanel-top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:relative}
.chanel-top-left{display:flex;align-items:center;gap:18px;font-size:11px;letter-spacing:.12em;font-weight:400}
.chanel-top-left a{display:flex;align-items:center;gap:6px;color:#000}
.chanel-logo{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--font-serif);font-size:28px;letter-spacing:.38em;font-weight:400;color:#000;cursor:pointer}
.chanel-logo small{display:block;font-family:var(--font-sans);font-size:7px;letter-spacing:.22em;text-align:center;margin-top:-4px;color:#000;font-weight:500}
.chanel-top-right{display:flex;align-items:center;gap:18px;font-size:18px}
.chanel-nav{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
.chanel-nav-inner{max-width:1440px;margin:0 auto;display:flex;justify-content:center;gap:32px;padding:12px 24px;overflow:auto;white-space:nowrap;scrollbar-width:none}
.chanel-nav-inner::-webkit-scrollbar{display:none}
.chanel-nav-inner a{font-size:11px;letter-spacing:.14em;font-weight:500;color:#000;position:relative;padding-bottom:2px}
.chanel-nav-inner a.active::after,.chanel-nav-inner a:hover::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:#000}
.chanel-nav-inner a.active{font-weight:600}
/* Breadcrumb like Chanel */
.breadcrumb{max-width:1440px;margin:0 auto;padding:14px 24px;font-size:11px;color:var(--gray);display:flex;gap:8px;align-items:center}
.breadcrumb a{color:var(--gray)}
.breadcrumb a:hover{color:#000}
/* SPLASH — keep original but CHANEL style skip button gold */
#splash{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center}
.stories-container{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.story-media-wrapper{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s;pointer-events:none}
.story-media-wrapper.active{opacity:1;pointer-events:auto}
.story-media{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:4px}
.story-progress-bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;direction:ltr}
.progress-segment{flex:1;height:2px;background:rgba(255,255,255,0.3);overflow:hidden}
.progress-fill{height:100%;background:#fff;width:0%}
.story-counter{position:absolute;top:18px;right:18px;background:rgba(0,0,0,0.5);color:#fff;padding:4px 10px;border-radius:999px;font-size:11px}
.splash-skip{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 28px;border-radius:0;font-size:11px;letter-spacing:.14em;border:1px solid #000}
.splash-skip:hover{background:#000;color:#fff}
/* CHANEL HERO — fullscreen like Chanel homepage (image + centered text) */
.chanel-hero{position:relative;height:68vh;min-height:520px;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
.chanel-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.92}
.chanel-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.45) 100%)}
.chanel-hero-content{position:relative;z-index:2;text-align:center;color:#fff;max-width:640px;padding:0 24px}
.chanel-hero-content .eyebrow{font-size:11px;letter-spacing:.22em;margin-bottom:12px;display:block}
.chanel-hero-content h1{font-family:var(--font-serif);font-size:42px;font-weight:300;letter-spacing:.06em;line-height:1.05;margin-bottom:12px}
.chanel-hero-content p{font-size:13px;letter-spacing:.04em;opacity:.9;margin-bottom:18px;font-weight:300}
.chanel-btn{border:1px solid #fff;color:#fff;padding:10px 28px;font-size:11px;letter-spacing:.14em;background:transparent;display:inline-block;transition:.3s}
.chanel-btn:hover{background:#fff;color:#000}
.chanel-btn-dark{border:1px solid #000;color:#000;padding:10px 28px;font-size:11px;letter-spacing:.14em;background:#fff;display:inline-block;transition:.3s}
.chanel-btn-dark:hover{background:#000;color:#fff}
/* CHANEL FILTER BAR */
.filter-bar{max-width:1440px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.08em}

.chanel-grid{max-width:1440px;margin:0 auto;padding:0 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.chanel-card{border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;padding:0;cursor:pointer;position:relative}
.chanel-card:nth-child(4n){border-right:0}
.chanel-img{aspect-ratio:1/1.15;background:#fff;overflow:hidden;position:relative}
.chanel-img img{width:100%;height:100%;object-fit:cover;transition:opacity .4s}
.chanel-img img.second{position:absolute;inset:0;opacity:0}
.chanel-card:hover .chanel-img img.first{opacity:0}
.chanel-card:hover .chanel-img img.second{opacity:1}
.chanel-info{padding:14px 12px 18px;text-align:center}
.chanel-info h3{font-size:11px;letter-spacing:.06em;font-weight:500;color:#000;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chanel-info p{font-size:11px;color:var(--gray);letter-spacing:.02em}
.chanel-info .price{font-size:11px;color:#000;margin-top:4px;letter-spacing:.04em}
.chanel-badge{position:absolute;top:12px;right:12px;background:#fff;border:1px solid #000;padding:3px 8px;font-size:9px;letter-spacing:.1em}
/* CHANEL SECTION HEAD */
.chanel-section{max-width:1440px;margin:0 auto;padding:32px 24px 0}
.chanel-section h2{font-family:var(--font-serif);font-size:22px;font-weight:300;letter-spacing:.08em;text-align:center;margin-bottom:8px}
.chanel-section p{font-size:11px;letter-spacing:.08em;color:var(--gray);text-align:center;margin-bottom:24px}
/* FOOTER CHANEL — exact */
.chanel-footer{border-top:1px solid var(--line);margin-top:40px;background:#fff}
.chanel-footer-inner{max-width:1440px;margin:0 auto;padding:32px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
.chanel-footer h4{font-size:11px;letter-spacing:.14em;margin-bottom:12px}
.chanel-footer a,.chanel-footer p{font-size:11px;color:var(--gray);line-height:2;display:block}
.chanel-footer a:hover{color:#000}
.chanel-footer-bottom{border-top:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;max-width:1440px;margin:0 auto;font-size:11px;color:var(--gray)}
.chanel-footer-bottom .social a{font-size:14px;color:#000;margin-left:12px}
/* Lightbox, chat keep minimal chanel */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:10000;display:none;flex-direction:column;align-items:center;justify-content:center}
.lightbox-img{max-width:95%;max-height:75vh;object-fit:contain;background:#000}
.lightbox-controls{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px;display:flex;justify-content:center;gap:12px}
.lightbox-controls button{border:1px solid #000;padding:8px 16px;font-size:11px;letter-spacing:.08em;background:#fff}
.lightbox-controls button:hover{background:#000;color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:8px 16px;font-size:11px;letter-spacing:.08em;display:none;z-index:2001}
@media(max-width:1024px){.chanel-grid{grid-template-columns:repeat(3,1fr)}.chanel-card:nth-child(4n){border-right:1px solid var(--line)}.chanel-card:nth-child(3n){border-right:0}}
@media(max-width:768px){.chanel-top{padding:0 12px}.chanel-logo{font-size:20px}.chanel-nav-inner{gap:18px;padding:10px 12px}.chanel-grid{grid-template-columns:repeat(2,1fr)}.chanel-card:nth-child(3n){border-right:1px solid var(--line)}.chanel-card:nth-child(2n){border-right:0}.chanel-hero{height:56vh;min-height:420px}.chanel-footer-inner{grid-template-columns:1fr 1fr}.chanel-hero-content h1{font-size:28px}}
@media(max-width:480px){.chanel-grid{grid-template-columns:repeat(2,1fr)}.chanel-footer-inner{grid-template-columns:1fr;text-align:center}}
</style>
</head>

<script>

            appId: "1:302609299720:web:e086b600c3ee824acd54bd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ================================================================
        // STATE
        // ================================================================
        let currentData = {};
        let currentPage = 'home';
        let currentImageList = [];
        let currentIndex = 0;
        let currentWhatsappNum = '966500000000';
        let currentAlbumId = null;
        let sliderInterval = null;
        let isSliderPaused = false;
        let isBlocked = false;
        let blockReason = "";

        const PLACEHOLDER_SVG =
            'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"%3E%3Crect width="400" height="400" fill="%23f0f0f0"/%3E%3Ctext x="50%25" y="50%25" font-size="20" font-family="Cairo" fill="%23999" text-anchor="middle" dy=".3em"%3Eصورة غير متوفرة%3C/text%3E%3C/svg%3E';

        // ================================================================
        // IMAGE LOADER
        // ================================================================
        function loadImageWithRetry(imgElement, src, maxAttempts = 5) {
            if (!imgElement) return;
            if (!src || src.trim() === '') {
                imgElement.src = PLACEHOLDER_SVG;
                imgElement.style.objectFit = 'contain';
                return;
            }

            const srcWithCache = src + (src.includes('?') ? '&' : '?') + '_t=' + Date.now();

            imgElement.src = PLACEHOLDER_SVG;
            imgElement.style.objectFit = 'contain';
            imgElement.style.background = '#f0f0f0';

            let attempts = 0;
            let timeoutId = null;

            function attemptLoad() {
                imgElement.src = srcWithCache;

                imgElement.onerror = function() {
                    if (attempts < maxAttempts) {
                        attempts++;
                        const delay = 500 * attempts;
                        clearTimeout(timeoutId);
                        timeoutId = setTimeout(attemptLoad, delay);
                    } else {
                        imgElement.src = PLACEHOLDER_SVG;
                        imgElement.style.objectFit = 'contain';
                        imgElement.style.background = '#f0f0f0';
                    }
                };

                imgElement.onload = function() {
                    clearTimeout(timeoutId);
                    imgElement.style.objectFit = 'cover';
                    imgElement.style.background = 'transparent';
                };

                const checkLoaded = () => {
                    if (imgElement.complete && imgElement.naturalWidth > 0) {
                        clearTimeout(timeoutId);
                        imgElement.style.objectFit = 'cover';
                        imgElement.style.background = 'transparent';
                        return;
                    }
                    if (attempts < maxAttempts) {
                        attempts++;
                        const delay = 500 * attempts;
                        clearTimeout(timeoutId);
                        timeoutId = setTimeout(attemptLoad, delay);
                    } else {
                        imgElement.src = PLACEHOLDER_SVG;
                        imgElement.style.objectFit = 'contain';
                        imgElement.style.background = '#f0f0f0';
                    }
                };

                clearTimeout(timeoutId);
                timeoutId = setTimeout(checkLoaded, 3000);
            }

            attemptLoad();
        }

        // ================================================================
        // SPLASH / STORIES - مُحسَّن بالكامل
        // ================================================================
        let currentStoryItems = [];
        let currentStoryIdx = 0;
        let storyTimer = null;
        let storyPlaying = true;
        let splashAutoCloseTimer = null;

        function isVideoUrl(url) {
            return /\.(mp4|webm|mov|ogg|mkv)$/i.test(url);
        }

        function showStorySplash(items, durationSec = 5) {
            const splashDiv = document.getElementById('splash');
            if (!splashDiv) return;

            if (!items || items.length === 0) {
                splashDiv.style.display = 'none';
                return;
            }

            if (storyTimer) clearInterval(storyTimer);
            if (splashAutoCloseTimer) clearTimeout(splashAutoCloseTimer);

            currentStoryItems = items;
            currentStoryIdx = 0;
            storyPlaying = true;

            splashDiv.innerHTML = `
                <div class="stories-container" id="storiesContainer">
                    <div class="story-progress-bar" id="storyProgressBar"></div>
                    <div class="story-counter" id="storyCounter">1 / ${items.length}</div>
                    <div class="story-nav prev" id="storyPrev"></div>
                    <div class="story-nav next" id="storyNext"></div>
                    <button class="splash-skip" id="splashSkipBtn">تخطي ←</button>
                    <div id="storyMediaWrapper" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;"></div>
                </div>
            `;

            const wrapper = document.getElementById('storyMediaWrapper');

            items.forEach((item, idx) => {
                const mediaWrapper = document.createElement('div');
                mediaWrapper.className = 'story-media-wrapper';
                if (idx === 0) mediaWrapper.classList.add('active');

                let mediaElement;
                if (item.type === 'video' || isVideoUrl(item.url)) {
                    mediaElement = document.createElement('video');
                    mediaElement.src = item.url;
                    mediaElement.muted = true;
                    mediaElement.playsInline = true;
                    mediaElement.preload = 'auto';
                    mediaElement.loop = false;
                    mediaElement.className = 'story-media';
                    mediaElement.onerror = () => {
                        mediaElement.src = PLACEHOLDER_SVG;
                        mediaElement.style.objectFit = 'contain';
                    };
                    mediaElement.onloadeddata = () => {
                        mediaElement.play().catch(() => {});
                    };
                } else {
                    mediaElement = document.createElement('img');
                    mediaElement.className = 'story-media';
                    mediaElement.alt = 'صورة';
                    mediaElement.onerror = () => {
                        mediaElement.src = PLACEHOLDER_SVG;
                        mediaElement.style.objectFit = 'contain';
                    };
                    loadImageWithRetry(mediaElement, item.url);
                }

                mediaWrapper.appendChild(mediaElement);
                wrapper.appendChild(mediaWrapper);
            });

            const progressBar = document.getElementById('storyProgressBar');
            for (let i = 0; i < items.length; i++) {
                const seg = document.createElement('div');
                seg.className = 'progress-segment';
                seg.innerHTML = `<div class="progress-fill" id="progressFill_${i}"></div>`;
                progressBar.appendChild(seg);
            }

            document.getElementById('storyPrev').addEventListener('click', () => navigateStory(-1));
            document.getElementById('storyNext').addEventListener('click', () => navigateStory(1));

            const skipBtn = document.getElementById('splashSkipBtn');
            skipBtn.addEventListener('click', closeSplash);

            let touchStartX = 0;
            const container = document.getElementById('storiesContainer');
            container.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
            });
            container.addEventListener('touchend', (e) => {
                const diff = e.changedTouches[0].clientX - touchStartX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) navigateStory(-1);
                    else navigateStory(1);
                }
            });

            splashDiv.style.display = 'flex';
            splashDiv.style.opacity = '1';

            startCurrentStoryItem(durationSec * 1000);

            const totalDuration = items.length * durationSec * 1000 + 2000;
            splashAutoCloseTimer = setTimeout(() => {
                if (storyPlaying) closeSplash();
            }, totalDuration);
        }

        function startCurrentStoryItem(durationMs) {
            if (storyTimer) clearInterval(storyTimer);

            const counterSpan = document.getElementById('storyCounter');
            if (counterSpan) {
                counterSpan.innerText = `${currentStoryIdx + 1} / ${currentStoryItems.length}`;
            }

            const allWrappers = document.querySelectorAll('.story-media-wrapper');
            allWrappers.forEach((el, idx) => {
                if (idx === currentStoryIdx) {
                    el.classList.add('active');
                    const video = el.querySelector('video');
                    if (video) {
                        video.currentTime = 0;
                        video.play().catch(() => {});
                    }
                } else {
                    el.classList.remove('active');
                    const video = el.querySelector('video');
                    if (video) video.pause();
                }
            });

            for (let i = 0; i < currentStoryItems.length; i++) {
                const fill = document.getElementById(`progressFill_${i}`);
                if (fill) {
                    if (i < currentStoryIdx) fill.style.width = '100%';
                    else if (i === currentStoryIdx) fill.style.width = '0%';
                    else fill.style.width = '0%';
                }
            }

            const currentFill = document.getElementById(`progressFill_${currentStoryIdx}`);
            const startTime = Date.now();

            storyTimer = setInterval(() => {
                if (!storyPlaying) {
                    clearInterval(storyTimer);
                    return;
                }
                const elapsed = Date.now() - startTime;
                const percent = Math.min(100, (elapsed / durationMs) * 100);
                if (currentFill) {
                    currentFill.style.width = percent + '%';
                }

                if (elapsed >= durationMs) {
                    clearInterval(storyTimer);
                    if (currentStoryIdx + 1 < currentStoryItems.length) {
                        navigateStory(1);
                    } else {
                        closeSplash();
                    }
                }
            }, 50);
        }

        function navigateStory(direction) {
            if (!storyPlaying) return;
            const newIdx = currentStoryIdx + direction;
            if (newIdx < 0 || newIdx >= currentStoryItems.length) {
                if (newIdx >= currentStoryItems.length) {
                    closeSplash();
                }
                return;
            }
            currentStoryIdx = newIdx;
            startCurrentStoryItem((currentData.splash_duration || 5) * 1000);
        }

        async function getOrCreateTicket() {
            const visitorId = getOrCreateVisitorId();
            let visitorName = localStorage.getItem('chat_visitor_name');
            if (!visitorName && !isNameRequested) { isNameRequested = true;
                visitorName = await requestUserName(); } else if (!visitorName) visitorName = 'زائر';
            currentVisitorName = visitorName;
            const ref = db.ref(`${DB_PATH}/chat_tickets`);
            const snap = await ref.orderByChild('visitorId').equalTo(visitorId).once('value');
            let existing = null;
            snap.forEach(child => { const t = child.val(); if (t && t.status === 'open') existing = { id: child.key,
                    ...t }; });
            if (existing) { currentTicketId = existing.id; return currentTicketId; }
            const newTicket = { ticketId: null, visitorId, visitorName, status: 'open', createdAt: Date.now(),
                lastMessageAt: Date.now() };
            const newRef = ref.push();
            newTicket.ticketId = newRef.key;
            await newRef.set(newTicket);
            currentTicketId = newRef.key;
            return currentTicketId;
        }

        async function sendChatMessage(message) {
            if (isBlocked) { showChatToast('🚫 تم حظرك من الدردشة'); return false; }
            if (!message.trim()) { showChatToast('❌ الرجاء كتابة رسالة'); return false; }
            if (!currentTicketId) await getOrCreateTicket();
            const data = { id: Date.now().toString(), sender: 'visitor', senderName: currentVisitorName, message: message
                    .trim(), timestamp: Date.now(), read: false };
            try {
                await db.ref(`${DB_PATH}/chat_messages/${currentTicketId}`).push(data);
                await db.ref(`${DB_PATH}/chat_tickets/${currentTicketId}`).update({ lastMessageAt: Date.now(),
                    status: 'open' });
                displayChatMessage(data, true);
                document.getElementById('chatInput').value = '';
                if (!isAdminOnline) showChatToast('📨 تم إرسال رسالتك. سيتم الرد عند عودة المشرف');
                return true;
            } catch (e) { console.error('Send error:', e);
                showChatToast('❌ فشل إرسال الرسالة'); return false; }
        }

        function displayChatMessage(data, isOwn, msgId = null) {
            const c = document.getElementById('chatMessages');

            const div = document.createElement('div');

            div.innerHTML =

            c.appendChild(div);

        async function loadPreviousMessages() {
            if (!currentTicketId) return;
            const c = document.getElementById('chatMessages');
            if (c) c.innerHTML = '';
            const snap = await db.ref(`${DB_PATH}/chat_messages/${currentTicketId}`).orderByChild('timestamp')
                .limitToLast(50).once('value');
            const msgs = [];
            snap.forEach(child => { if (child.val()) msgs.push({ key: child.key, ...child.val() }); });
            msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            msgs.forEach(msg => { const own = (msg.sender === 'visitor');
                displayChatMessage(msg, own, msg.key); if (!own && !msg.read && currentTicketId) db.ref(
                    `${DB_PATH}/chat_messages/${currentTicketId}/${msg.key}`).update({ read: true }); });

        async function initChatSystem() {
            const w = document.getElementById('chatWindow'),
                tog = document.getElementById('chatToggleBtn'),
                close = document.getElementById('chatCloseBtn'),
                send = document.getElementById('chatSendBtn'),
                inp = document.getElementById('chatInput');
            const handleSend = () => { const msg = inp.value.trim(); if (msg && !isBlocked) sendChatMessage(msg);
                else if (isBlocked) showChatToast('🚫 تم حظرك من الدردشة'); };
            if (send) send.onclick = handleSend;
            if (inp) inp.onkeypress = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();

        // ================================================================
        // LIGHTBOX
        // ================================================================
        const imgElement = document.getElementById('lightboxImg');
        const lightbox = document.getElementById('lightbox');
        const counterSpan = document.getElementById('lightboxCounter');
        const waBtn = document.getElementById('lightboxWhatsappBtn');

        const ratingContainer = document.getElementById('ratingContainer');
        const ratingStars = document.getElementById('ratingStars');
        const ratingStarsSummary = document.getElementById('ratingStarsSummary');
        const ratingCountText = document.getElementById('ratingCountText');
        const ratingViewsText = document.getElementById('ratingViewsText');
        const ratingToast = document.getElementById('ratingToast');

        let scale = 1,
            translateX = 0,
            translateY = 0,
            startX = 0,
            startY = 0,
            isPanning = false;
        let initialPinchDist = 0,
            startScale = 1,
            pinchCenterX = 0,
            pinchCenterY = 0,
            touchStartXPan = 0;
        let ratingToastTimeout = null;

        function setTransform() { imgElement.style.transform =
            `translate(${translateX}px, ${translateY}px) scale(${scale})`; }

        function resetTransform() { scale = 1;
            translateX = 0;
            translateY = 0;
            setTransform(); }

        function clampMovement() {
            const containerRect = imgElement.parentElement.getBoundingClientRect();
            const imgRect = imgElement.getBoundingClientRect();
            const maxX = Math.max(0, (imgRect.width * scale - containerRect.width) / 2);
            const maxY = Math.max(0, (imgRect.height * scale - containerRect.height) / 2);
            translateX = Math.min(Math.max(translateX, -maxX), maxX);
            translateY = Math.min(Math.max(translateY, -maxY), maxY);
            setTransform();
        }

        function onMouseDown(e) { if (scale <= 1) return;
            e.preventDefault();
            isPanning = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            imgElement.style.cursor = 'grabbing'; }

        function onMouseMove(e) { if (!isPanning) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            clampMovement(); }

        function onMouseUp() { isPanning = false;
            imgElement.style.cursor = 'grab'; }

        function getDistance(touches) { return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY -
                touches[1].clientY); }

        function onTouchStart(e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                initialPinchDist = getDistance(e.touches);
                startScale = scale;
                pinchCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                pinchCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                document.getElementById('zoomHint').style.opacity = '1';
                setTimeout(() => document.getElementById('zoomHint').style.opacity = '0', 2000);
            } else if (e.touches.length === 1) {
                touchStartXPan = e.touches[0].clientX;
                if (scale > 1) { isPanning = true;
                    startX = e.touches[0].clientX - translateX;
                    startY = e.touches[0].clientY - translateY; }
            }
        }

        function onTouchMove(e) {
            if (e.touches.length === 2 && initialPinchDist > 0) {
                e.preventDefault();
                const newDist = getDistance(e.touches);
                let newScale = startScale * (newDist / initialPinchDist);
                newScale = Math.min(4, Math.max(1, newScale));
                if (newScale !== scale) {
                    const rect = imgElement.getBoundingClientRect();
                    const offsetX = pinchCenterX - rect.left;
                    const offsetY = pinchCenterY - rect.top;
                    const ratio = newScale / scale;
                    translateX = pinchCenterX - rect.left - (offsetX - translateX) * ratio;
                    translateY = pinchCenterY - rect.top - (offsetY - translateY) * ratio;
                    scale = newScale;
                    clampMovement();
                }
            } else if (e.touches.length === 1 && isPanning && scale > 1) {
                e.preventDefault();
                translateX = e.touches[0].clientX - startX;
                translateY = e.touches[0].clientY - startY;
                clampMovement();
            }
        }

        function onTouchEnd(e) {
            if (e.touches.length < 2) initialPinchDist = 0;
            if (e.touches.length === 0) {
                if (touchStartXPan && e.changedTouches[0] && scale <= 1) {
                    const diff = e.changedTouches[0].clientX - touchStartXPan;
                    if (Math.abs(diff) > 50) { if (diff > 0) prevImage();
                        else nextImage(); }
                }
                touchStartXPan = 0;
                isPanning = false;
            }
        }

        function onWheel(e) {
            e.preventDefault();
            let delta = e.deltaY > 0 ? -0.1 : 0.1;
            let newScale = Math.min(4, Math.max(1, scale + delta));
            if (newScale === scale) return;
            const rect = imgElement.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const ratio = newScale / scale;
            translateX = e.clientX - rect.left - (mouseX - translateX) * ratio;
            translateY = e.clientY - rect.top - (mouseY - translateY) * ratio;
            scale = newScale;
            clampMovement();
            document.getElementById('zoomHint').style.opacity = '1';
            setTimeout(() => document.getElementById('zoomHint').style.opacity = '0', 2000);
        }

        function bindLightboxEvents() {
            imgElement.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            imgElement.addEventListener('touchstart', onTouchStart, { passive: false });
            imgElement.addEventListener('touchmove', onTouchMove, { passive: false });
            imgElement.addEventListener('touchend', onTouchEnd);
            imgElement.addEventListener('wheel', onWheel, { passive: false });
        }

        function unbindLightboxEvents() {
            imgElement.removeEventListener('mousedown', onMouseDown);
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('mouseup', onMouseUp);
            imgElement.removeEventListener('touchstart', onTouchStart);
            imgElement.removeEventListener('touchmove', onTouchMove);
            imgElement.removeEventListener('touchend', onTouchEnd);
            imgElement.removeEventListener('wheel', onWheel);
        }

        function updateCounter() { counterSpan.innerText = `${currentIndex+1} / ${currentImageList.length}`; }

        async function incrementAlbumViews(albumId) {
            if (!albumId) return;
            const key = `viewed_${albumId}`;
            if (sessionStorage.getItem(key)) return;
            const ref = db.ref(`${DB_PATH}/albums/${albumId}`);
            await ref.transaction(album => { if (album) album.views = (album.views || 0) + 1; return album; });
            sessionStorage.setItem(key, '1');
            if (currentData.albums && currentData.albums[albumId]) currentData.albums[albumId].views = (currentData
                .albums[albumId].views || 0) + 1;
        }

        // ================================================================
        // RATING SYSTEM
        // ================================================================
        function showRatingToast(message, type = 'success') {
            if (ratingToastTimeout) clearTimeout(ratingToastTimeout);
            ratingToast.className = `rating-toast ${type}`;
            ratingToast.textContent = message;
            ratingToast.style.display = 'block';
            ratingToastTimeout = setTimeout(() => { ratingToast.style.display = 'none'; }, 3000);
        }

        async function updateRatingUI(albumId) {
            if (!albumId || !ratingContainer) {
                ratingContainer.classList.remove('visible');
                return;
            }
            const album = currentData.albums?.[albumId];
            if (!album) {
                ratingContainer.classList.remove('visible');
                return;
            }
            ratingContainer.classList.add('visible');

            const avg = (album.rating_sum && album.rating_count) ? (album.rating_sum / album.rating_count) : 0;
            const count = album.rating_count || 0;
            const views = album.views || 0;

            ratingStarsSummary.textContent = `⭐ ${avg.toFixed(1)}`;
            ratingCountText.textContent = `(${count})`;
            ratingViewsText.textContent = `👁️ ${views}`;

            const stars = ratingStars.querySelectorAll('i');
            const roundedAvg = Math.round(avg);
            stars.forEach((star, idx) => {
                const value = idx + 1;
                if (value <= roundedAvg) { star.classList.add('active'); } else { star.classList.remove(
                    'active'); }
                star.classList.remove('hover');
            });

            stars.forEach(star => {
                star.removeEventListener('click', handleStarClickNew);
                star.removeEventListener('mouseenter', handleStarHoverNew);
                star.removeEventListener('mouseleave', handleStarLeaveNew);
                star.addEventListener('click', handleStarClickNew);
                star.addEventListener('mouseenter', handleStarHoverNew);
                star.addEventListener('mouseleave', handleStarLeaveNew);
            });
        }

        function handleStarHoverNew(e) {
            const val = parseInt(e.currentTarget.getAttribute('data-value'));
            const stars = ratingStars.querySelectorAll('i');
            stars.forEach((star, idx) => {
                if (idx < val) { star.classList.add('hover'); } else { star.classList.remove('hover'); }
            });
        }

        function handleStarLeaveNew() {
            const stars = ratingStars.querySelectorAll('i');
            stars.forEach(star => star.classList.remove('hover'));
        }

        async function handleStarClickNew(e) {
            e.stopPropagation();
            const val = parseInt(e.currentTarget.getAttribute('data-value'));
            await submitRatingNew(currentAlbumId, val);
        }

        async function submitRatingNew(albumId, rating) {
            if (!albumId) return;
            const key = `rated_${albumId}`;
            if (localStorage.getItem(key)) {
                showRatingToast('لقد قمت بتقييم هذا الألبوم مسبقاً', 'info');
                return;
            }
            const ref = db.ref(`${DB_PATH}/albums/${albumId}`);
            await ref.transaction(album => {
                if (album) {
                    album.rating_sum = (album.rating_sum || 0) + rating;
                    album.rating_count = (album.rating_count || 0) + 1;
                }
                return album;
            });
            localStorage.setItem(key, '1');
            const snap = await ref.once('value');
            const updated = snap.val();
            if (updated && currentData.albums) {
                currentData.albums[albumId] = updated;
                await updateRatingUI(albumId);
                showRatingToast(`شكراً لتقييمك (${rating} نجوم) 🌟`, 'success');
            }
        }

        // ================================================================
        // LIGHTBOX OPEN / CLOSE
        // ================================================================
        async function openLightbox(images, index, albumId = null) {
            if (!images || !images.length) return;
            if (sliderInterval) { clearInterval(sliderInterval);
                sliderInterval = null;
                isSliderPaused = true; }

            currentIndex = index;
            loadImageWithRetry(imgElement, images[index]);

            updateCounter();

            document.body.style.overflow = 'hidden';

                await incrementAlbumViews(albumId);

                ratingContainer.classList.remove('visible');

        function closeLightbox() {

        function buildHomeSlider() {

            if (sliderImagesArray.length === 0) { buildAlbumsBackup(container); return; }
            autoDuration = (sliderData.duration || 5) * 1000;
            currentSlideIndex = 0;
            let slideInterval,
                isPaused = false;
            container.innerHTML =
                `<div class="hero-slider-beige"><div class="slider-bg-blur" id="sliderBgBlur" style="background-image: url('${sliderImagesArray[0]}')"></div><div class="slider-stage"><div class="slider-image-card" id="sliderMainCard"><img id="sliderMainImg" alt="بصمه غير - أحدث الأعمال"></div></div><div class="slider-nav-buttons"><button id="sliderPrev"><i class="fas fa-chevron-right"></i> السابق</button><button id="sliderNext">التالي <i class="fas fa-chevron-left"></i></button></div><div class="slider-progress-ring" id="sliderProgress">${autoDuration/1000}s</div></div>`;
            const bgBlur = document.getElementById('sliderBgBlur'),

                nextBtn = document.getElementById('sliderNext'),

            function updateSlide(index, resetTimer = true) {
                if (index < 0) index = sliderImagesArray.length - 1;

                currentSlideIndex = index;
                loadImageWithRetry(mainImg, sliderImagesArray[currentSlideIndex]);
                bgBlur.style.backgroundImage = `url('${sliderImagesArray[currentSlideIndex]}')`;
                if (resetTimer) restartTimer();
            }

            function restartTimer() {
                if (slideInterval) clearInterval(slideInterval);
                let startTime = Date.now();
                slideInterval = setInterval(() => {
                    if (isPaused) return;
                    let elapsed = Date.now() - startTime;
                    let remaining = Math.max(0, autoDuration - elapsed);
                    progressSpan.innerText = Math.ceil(remaining / 1000) + 's';
                    if (elapsed >= autoDuration) { clearInterval(slideInterval);
                        nextSlide(); }
                }, 100);
            }

            function nextSlide() { updateSlide(currentSlideIndex + 1, true); }

            function prevSlide() { updateSlide(currentSlideIndex - 1, true); }

            prevBtn.onclick = () => { isPaused = false;

        function formatTime12(t) {

        function getGroupedScheduleHtml(d) {
            if (!d.work_schedule) return '<p>لم تحدد المواعيد</p>';
            const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
            const order = [6, 0, 1, 2, 3, 4, 5];
            let groups = [],
                off = [];
            order.forEach(jsDay => {
                const s = d.work_schedule[jsDay];
                if (s && s.active) {
                    const key = `${s.s1_s}-${s.s1_e}-${s.s2_a}`;
                    let g = groups.find(g => g.key === key);
                    if (g) g.days.push(days[jsDay]);
                    else groups.push({ key, days: [days[jsDay]], data: s });
                } else off.push(days[jsDay]);
            });
            let html = '';
            groups.forEach(g => {
                const dTxt = g.days.length === 1 ? g.days[0] : `من ${g.days[0]} إلى ${g.days[g.days.length-1]}`;
                html +=
                    `<div class="schedule-item"><strong>${dTxt}</strong><br>${formatTime12(g.data.s1_s)} - ${formatTime12(g.data.s1_e)}`;
                if (g.data.s2_a) html += `<br>${formatTime12(g.data.s2_s)} - ${formatTime12(g.data.s2_e)}`;
                html += `</div>`;
            });
            if (off.length) html += `<div class="schedule-item"><strong>عطلة:</strong> ${off.join('، ')}</div>`;
            return html;
        }

                    const wgrid=document.getElementById('homeWorksChanel');
                    if(wgrid){
                        const albums=getAlbumsList().slice(0,8);
                        if(albums.length){ wgrid.innerHTML=albums.map(alb=>{const cover=alb.imgs&&Object.values(alb.imgs)[0]?Object.values(alb.imgs)[0].url:'';return `<div class="chanel-card" onclick="openAlbum('${alb.id}')"><div class="chanel-img"><img src="${cover}" loading="lazy"></div><div class="chanel-info"><h3>${(alb.name||'ألبوم').replace(/'/g," " )}</h3><p>${alb.imgs?Object.keys(alb.imgs).length:0} صورة</p></div></div>`}).join(''); wgrid.querySelectorAll('img').forEach(img=>{const s=img.getAttribute('src'); if(s) loadImageWithRetry(img,s)}); }
                        else wgrid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#767676;font-size:11px">لا توجد أعمال</div>';
                    }
                },0);
                try{ buildHomeSlider(); }catch(e){}
            } else if (currentPage === 'store') {
                const bc=document.getElementById('breadcrumbCurrent'); if(bc) bc.innerText='المتجر';
                main.innerHTML=`<div class="filter-bar"><div class="filter-bar-left"><span id="storeCount">0 منتج</span> <select id="storeSort" onchange="buildAllProductsGrid()"><option>ترتيب افتراضي</option><option>السعر: منخفض إلى مرتفع</option></select></div><span>CHANEL.COM</span></div><div id="allProductsGrid" class="chanel-grid"></div>`;
                buildAllProductsGrid();
            } else if (currentPage === 'works') {
                const bc=document.getElementById('breadcrumbCurrent'); if(bc) bc.innerText='أعمالنا';
                main.innerHTML=`<div class="chanel-section"><h2>أعمالنا</h2><p>ألبومات حصرية — اضغط للدخول</p><div id="worksGrid" class="chanel-grid"></div></div>`;
                buildWorksGrid();
            } else if (currentPage === 'catalogs') {
                main.innerHTML =
                    `<div class="container section"><h2 class="section-title">الكتالوجات</h2><div id="catalogsPageGrid"></div></div>`;
                buildCatalogsPageGrid();
            } else if (currentPage === 'contact') {
                main.innerHTML =
                    `<div class="container section"><h2 class="section-title">اتصل بنا</h2><div style="display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;text-align:center;"><a href="tel:0541780995" style="text-decoration:none;"><div><i class="fas fa-phone fa-2x" style="color:var(--primary);"></i><p>اتصل بنا</p></div></a><a href="https://wa.me/${currentWhatsappNum}" target="_blank" style="text-decoration:none;"><div><i class="fab fa-whatsapp fa-2x" style="color:#25D366;"></i><p>واتساب</p></div></a>${currentData.insta_url ? `<a href="${currentData.insta_url}" target="_blank" style="text-decoration:none;"><div><i class="fab fa-instagram fa-2x" style="color:var(--primary);"></i><p>انستقرام</p></div></a>` : ''}${currentData.tiktok_url ? `<a href="${currentData.tiktok_url}" target="_blank" style="text-decoration:none;"><div><i class="fab fa-tiktok fa-2x" style="color:var(--primary);"></i><p>تيك توك</p></div></a>` : ''}${currentData.snap_url ? `<a href="${currentData.snap_url}" target="_blank" style="text-decoration:none;"><div><i class="fab fa-snapchat fa-2x" style="color:var(--primary);"></i><p>سناب شات</p></div></a>` : ''}<a href="${currentData.location_url || '#'}" target="_blank" style="text-decoration:none;"><div><i class="fas fa-map-marker-alt fa-2x" style="color:var(--primary);"></i><p>الموقع</p></div></a></div><div style="text-align:center;margin-top:20px;"><p>📞 0541780995</p></div></div>`;
            }
            updateFooterData();
            renderNavLinks();
            bindHeroButtons();
            updatePageTitle();
        }

        // ================================================================
        // MAINTENANCE & POPUP
        // ================================================================
        let maintenanceInterval, popupTimeout;

        function updateMaintenanceMode() {
            const d = currentData,
                screen = document.getElementById('maintenanceScreen');
            if (!d.maintenance_mode) {
                if (screen.style.display !== 'none') screen.style.display = 'none';
                if (maintenanceInterval) clearInterval(maintenanceInterval);
                return;
            }
            const until = d.maintenance_until,
                title = d.maintenance_title || 'الموقع في صيانة',
                msg = d.maintenance_message || 'نعمل على تحسين تجربتك، سنعود قريباً';
            if (until && until <= Date.now()) {
                db.ref(DB_PATH).update({ maintenance_mode: false, maintenance_until: null });
                return;
            }
            screen.innerHTML =
                `<div><i class="fas fa-tools fa-4x" style="color:var(--primary);"></i><h2 style="margin:16px 0 8px;">${title}</h2><p style="color:#666;">${msg}</p>${until ? `<div id="maintenanceCountdown" style="font-size:1.8rem;font-weight:700;margin-top:16px;color:var(--primary);"></div>` : ''}</div>`;
            screen.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            if (until) {
                const countdownEl = document.getElementById('maintenanceCountdown');
                const updateCountdown = () => {
                    let diff = until - Date.now();
                    if (diff <= 0) { clearInterval(maintenanceInterval);
                        window.location.reload(); return; }
                    const h = Math.floor(diff / 3600000),
                        m = Math.floor((diff % 3600000) / 60000),
                        s = Math.floor((diff % 60000) / 1000);
                    if (countdownEl) countdownEl.innerText =
                        `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                };
                updateCountdown();
                maintenanceInterval = setInterval(updateCountdown, 1000);
            }
        }

        function updatePopup() {
            const bubble = document.getElementById('popupBubble'),
                msgSpan = document.getElementById('popupMessage');
            if (!currentData.popup_enabled || !currentData.popup_message) {
                if (bubble) bubble.style.display = 'none';
                if (popupTimeout) clearTimeout(popupTimeout);
                return;
            }
            if (bubble.style.display === 'none' || bubble.style.display === '') {
                msgSpan.innerText = currentData.popup_message;
                bubble.style.display = 'block';
                if (popupTimeout) clearTimeout(popupTimeout);
                popupTimeout = setTimeout(() => { bubble.style.display = 'none'; }, (currentData.popup_duration ||
                    7) * 1000);
            }
        }
        window.closePopup = function() {
            const bubble = document.getElementById('popupBubble');
            if (bubble) bubble.style.display = 'none';
            if (popupTimeout) clearTimeout(popupTimeout);
        };

        // ================================================================
        // REFRESH
        // ================================================================
        function refreshAll() {
            renderPartnersMarquee();
            loadPage();
            updateMaintenanceMode();
            updatePopup();
        }

        // Incremental refresh used for the live listener: only rebuilds the
        // parts of the page whose underlying data actually changed, so a
        // rating/view/chat update elsewhere in the database no longer resets
        // the slider position, scroll position, or an open lightbox for
        // every visitor currently on the site.
        function refreshSmart(newData) {
            const oldData = currentData || {};
            currentData = newData || {};

            // Cheap & idempotent — safe to run on every tick, no visual reset if unchanged.
            updateMaintenanceMode();
            updatePopup();

            if (JSON.stringify(oldData.partners) !== JSON.stringify(currentData.partners)) {
                renderPartnersMarquee();
            }

            const footerKeys = ['whatsapp_num', 'site_name', 'location_url', 'insta_url', 'tiktok_url', 'snap_url', 'work_schedule', 'footer_text'];
            const footerChanged = footerKeys.some(k => JSON.stringify(oldData[k]) !== JSON.stringify(currentData[k]));
            if (footerChanged) {
                updateFooterData();
                updatePageTitle();
            }

            if (currentPage === 'home') {
                const sliderChanged = JSON.stringify(oldData.home_slider) !== JSON.stringify(currentData.home_slider);
                const noSlider = !currentData.home_slider || !currentData.home_slider.enabled;
                const albumsChanged = JSON.stringify(oldData.albums) !== JSON.stringify(currentData.albums);
                if (sliderChanged || (noSlider && albumsChanged)) {
                    buildHomeSlider();
                }
            } else if (currentPage === 'store') {
                if (JSON.stringify(oldData.store_categories) !== JSON.stringify(currentData.store_categories)) {
                    buildAllProductsGrid();
                }
            } else if (currentPage === 'works') {
                if (JSON.stringify(oldData.albums) !== JSON.stringify(currentData.albums)) {
                    buildWorksGrid();
                }
            } else if (currentPage === 'catalogs') {
                if (JSON.stringify(oldData.catalogs) !== JSON.stringify(currentData.catalogs)) {
                    buildCatalogsPageGrid();
                }
            }

            // Keep an open lightbox's rating/views live without closing it.
            if (currentAlbumId && currentData.albums) {
                const oldAlbum = oldData.albums ? oldData.albums[currentAlbumId] : null;
                const newAlbum = currentData.albums[currentAlbumId];
                if (newAlbum && JSON.stringify(oldAlbum) !== JSON.stringify(newAlbum)) {
                    updateRatingUI(currentAlbumId);
                }
            }
        }

        // ================================================================
        // INIT SPLASH
        // ================================================================
        function initSplash() {
            const items = [];

            if (currentData.splash_items && currentData.splash_items.length > 0) {
                currentData.splash_items.forEach(item => {
                    items.push({
                        url: item.url,
                        type: item.type || (isVideoUrl(item.url) ? 'video' : 'image')
                    });
                });
            } else if (currentData.splash_stories_videos && currentData.splash_stories_videos.length > 0) {
                currentData.splash_stories_videos.forEach(url => {
                    items.push({ url, type: 'video' });
                });
            } else if (currentData.splash_media_url) {
                items.push({
                    url: currentData.splash_media_url,
                    type: (currentData.splash_type === 'video' ? 'video' : 'image')
                });
            }

            if (items.length > 0 && currentData.splash_enabled !== false) {
                showStorySplash(items, currentData.splash_duration || 5);
            } else {
                document.getElementById('splash').style.display = 'none';
            }
        }

        // ================================================================
        // INIT
        // ================================================================
        let forceHideTimer = null;

        function forceHideSplash() {
            const splashDiv = document.getElementById('splash');
            if (splashDiv && splashDiv.style.display !== 'none') {
                splashDiv.style.opacity = '0';
                setTimeout(() => { splashDiv.style.display = 'none'; }, 500);
            }
            if (forceHideTimer) clearTimeout(forceHideTimer);
        }

        // Initialize the active page from the URL hash (deep link support)
        // before the first render, so a shared link like #store or
        // #works/albumId opens directly to the right place.
        currentPage = getHashParts().page;

        const maxWaitTime = 5000;
        forceHideTimer = setTimeout(() => {
            console.warn('⚠️ Firebase timeout, forcing splash hide');
            forceHideSplash();
            if (!currentData || Object.keys(currentData).length === 0) { currentData = {};
                refreshAll(); }
        }, maxWaitTime);

        db.ref(DB_PATH).once('value').then(snap => {
            clearTimeout(forceHideTimer);
            currentData = snap.val() || {};
            initSplash();
            refreshAll();
            initChatSystem();
            if (!location.hash) {
                history.replaceState(null, '', '#home');
            }
            const initialAlbumId = getHashParts().albumId;
            if (initialAlbumId) tryOpenAlbumFromHash(initialAlbumId);
        }).catch(err => {
            console.error('❌ Firebase read error:', err);
            clearTimeout(forceHideTimer);
            currentData = {};
            forceHideSplash();
            refreshAll();
            initChatSystem();
            showToast('حدث خطأ في الاتصال، يتم عرض بيانات تجريبية');
        });

        db.ref(DB_PATH).on('value', snap => {
            if (snap.exists()) { refreshSmart(snap.val()); }
        });

        // ================================================================
        // PREVENT IMAGE DOWNLOAD
        // ================================================================
        (function blockImageDownload() {
            function disableContextAndDrag(img) {
                img.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });
                img.addEventListener('dragstart', (e) => { e.preventDefault(); return false; });
            }
            document.querySelectorAll('img').forEach(disableContextAndDrag);
            const observer = new MutationObserver(() => {
                document.querySelectorAll('img').forEach(img => {
                    if (!img.hasAttribute('data-blocked')) {
                        img.setAttribute('data-blocked', 'true');
                        disableContextAndDrag(img);
                    }
                });
            });
            observer.observe(document.body, { childList: true, subtree: true });
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                    e.preventDefault();
                    showToast('❌ تم تعطيل حفظ الصور');
                    return false;
                }
                if (e.key === 'F12') { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); return false; }
            });
        })();

        window.openAlbum = openAlbum;
        window.openCatalog = openCatalog;
    </script>
</body>
</html>

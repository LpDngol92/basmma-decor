    <style>
        /* ================================================================
           ATELIER EDITORIAL v4 — هيكل بصري جديد كلياً
           نفس قاعدة البيانات site_v28 — بدون أي تغيير على المسارات
           ================================================================ */
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --espresso:#13100b; --espresso2:#1d1811; --ink:#241d14; --cream:#f3ecdf;
            --paper:#fbf8f1; --paper2:#f5efe3; --brass:#c08a3e; --brass-ink:#96651f;
            --brass-soft:#f6ebd9; --line:#e7ddca; --line2:#d8cdb8; --muted:#7c7362;
            --wa:#25D366; --wa-ink:#128C7E; --red:#c22f2f;
            --r-lg:22px; --r-md:16px; --r-pill:999px;
            --sh:0 1px 2px rgba(19,16,11,.05),0 14px 34px rgba(19,16,11,.07);
            --sh-lg:0 30px 80px rgba(19,16,11,.18);
            --font:'IBM Plex Sans Arabic',sans-serif;
            --display:'Cairo','IBM Plex Sans Arabic',sans-serif;
            --ease:.35s cubic-bezier(.35,.7,.25,1);
        }
        html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
        body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
        body{padding-bottom:env(safe-area-inset-bottom)}
        img{max-width:100%;display:block}
        a{text-decoration:none;color:inherit}
        button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
        input,select{font-family:var(--font)}
        ::selection{background:var(--brass);color:#fff}
        ::-webkit-scrollbar{width:9px;height:9px}
        ::-webkit-scrollbar-thumb{background:#cfc3a9;border-radius:99px}
        ::-webkit-scrollbar-thumb:hover{background:var(--brass)}
        ::-webkit-scrollbar-track{background:var(--paper2)}
        .container{max-width:1290px;margin:0 auto;padding:0 24px}

        /* ============ HEADER ============ */
        .hdr{position:sticky;top:0;z-index:1000;background:rgba(251,248,241,.88);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
        .hdr-in{max-width:1290px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
        .logo{display:flex;align-items:center;gap:11px;cursor:pointer;flex-shrink:0}
        .logo-mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,var(--brass),var(--brass-ink));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-weight:1000;font-size:1.25rem;box-shadow:0 8px 22px rgba(192,138,62,.35);position:relative;overflow:hidden}
        .logo-mark img{width:100%;height:100%;object-fit:cover}
        .logo-mark::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.35),transparent 65%);transform:translateX(-100%);animation:shine 4.5s infinite}
        @keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}
        .logo-text b{display:block;font-family:var(--display);font-weight:900;font-size:1.18rem;line-height:1.05;color:var(--ink)}
        .logo-text small{display:block;font-size:.53rem;letter-spacing:.26em;color:var(--brass-ink);font-weight:700;opacity:.85;margin-top:2px}
        .hdr-nav{display:flex;gap:2px;align-items:center;margin:0 auto}
        .hdr-nav a{position:relative;font-weight:600;color:var(--muted);font-size:.83rem;padding:10px 14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:var(--ease)}
        .hdr-nav a::after{content:'';position:absolute;bottom:4px;right:14px;left:14px;height:2px;background:var(--brass);border-radius:9px;transform:scaleX(0);transition:var(--ease)}
        .hdr-nav a:hover{color:var(--ink)}
        .hdr-nav a.active{color:var(--ink);font-weight:800}
        .hdr-nav a.active::after{transform:scaleX(1)}
        .hsearch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--r-pill);padding:9px 16px;min-width:200px;transition:var(--ease)}
        .hsearch:focus-within{border-color:var(--brass);box-shadow:0 0 0 4px rgba(192,138,62,.14)}
        .hsearch i{color:var(--muted);font-size:.8rem}
        .hsearch input{flex:1;border:none;background:transparent;outline:none;font-size:.83rem;min-width:0;color:var(--ink)}
        .hsearch button{color:var(--brass-ink);font-weight:800;font-size:.72rem}
        .hdr-utils{display:flex;align-items:center;gap:10px;flex-shrink:0}
        .hd-badge{font-size:.62rem;font-weight:800;color:var(--brass-ink);background:var(--brass-soft);border:1px solid var(--line2);padding:5px 13px;border-radius:var(--r-pill);white-space:nowrap}
        .hd-util{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;font-weight:700;color:var(--ink2,#3c331f);transition:var(--ease)}
        .hd-util:hover{color:var(--brass-ink)}
        .hd-util i{color:var(--brass)}
        .hd-wa{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--wa),var(--wa-ink));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.15rem;box-shadow:0 8px 20px rgba(37,211,102,.3);transition:var(--ease)}
        .hd-wa:hover{transform:translateY(-2px) scale(1.04)}

        /* ============ MOBILE DOCK ============ */
        .dock{position:fixed;bottom:0;left:0;right:0;z-index:1500;display:none;background:rgba(251,248,241,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
        .dock a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;color:var(--muted);font-size:.6rem;font-weight:700;border-radius:14px;transition:var(--ease)}
        .dock a i{font-size:1.05rem}
        .dock a.active{color:var(--brass-ink);background:var(--brass-soft)}

        /* ============ VIRTUAL HERO ============ */
        .vh{position:relative;min-height:calc(100svh - 70px);background:var(--espresso);color:var(--cream);display:flex;align-items:stretch;overflow:hidden}
        .vh-bg{position:absolute;inset:0}
        .vh-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
        .vh-slide.on{opacity:1}
        .vh-slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.03);transition:transform 7s linear}
        .vh-slide.on img{transform:scale(1)}
        .vh-veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,10,6,.88) 0%,rgba(12,10,6,.55) 45%,rgba(12,10,6,.25) 100%),linear-gradient(0deg,rgba(12,10,6,.75),transparent 38%)}
        .vh-ghost{position:absolute;top:50%;left:-4%;transform:translateY(-58%);font-family:var(--display);font-weight:1000;font-size:52vh;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(243,236,223,.07);pointer-events:none;user-select:none}
        .vh-in{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;width:100%;padding:70px 0 96px}
        .vh-badge{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);padding:8px 17px;border-radius:var(--r-pill);font-size:.73rem;font-weight:700;width:fit-content;margin-bottom:22px}
        .vh-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 0 5px rgba(37,211,102,.18);animation:pulse 2s infinite}
        @keyframes pulse{50%{box-shadow:0 0 0 10px rgba(37,211,102,.04)}}
        .vh h1{font-family:var(--display);font-weight:1000;font-size:clamp(2.4rem,6.4vw,4.7rem);line-height:1.08;letter-spacing:-.03em;max-width:14ch}
        .vh h1 em{font-style:normal;background:linear-gradient(120deg,#e8bd7d,var(--brass));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .vh h1 u{text-decoration:none;position:relative;white-space:nowrap}
        .vh h1 u::after{content:'';position:absolute;right:0;left:0;bottom:6px;height:14px;background:rgba(192,138,62,.4);border-radius:4px;z-index:-1}
        .vh-p{max-width:46ch;color:rgba(243,236,223,.72);font-size:clamp(.92rem,1.7vw,1.08rem);line-height:1.9;margin:20px 0 30px}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 28px;border-radius:var(--r-pill);font-weight:800;font-size:.9rem;transition:var(--ease);border:none;cursor:pointer}
        .btn-brass{background:linear-gradient(135deg,#d8a253,var(--brass-ink));color:#fff;box-shadow:0 14px 34px rgba(192,138,62,.4)}
        .btn-brass:hover{transform:translateY(-2px)}
        .btn-glass{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.25);color:var(--cream);backdrop-filter:blur(8px)}
        .btn-glass:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
        .btn-wa{background:var(--wa);color:#fff;box-shadow:0 12px 28px rgba(37,211,102,.32)}
        .btn-wa:hover{background:var(--wa-ink);transform:translateY(-2px)}
        .btn-dark{background:var(--espresso);color:var(--cream)}
        .btn-dark:hover{background:#000;transform:translateY(-2px)}
        .btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line2)}
        .btn-outline:hover{border-color:var(--brass);color:var(--brass-ink);background:var(--brass-soft)}
        .vh-btns{display:flex;gap:12px;flex-wrap:wrap}
        .vh-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
        .vh-stat{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px);padding:12px 18px;border-radius:16px;transition:var(--ease)}
        .vh-stat:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
        .vh-stat i{color:var(--brass);font-size:1.05rem}
        .vh-stat b{font-family:var(--display);font-size:1.15rem;line-height:1;color:#fff}
        .vh-stat span{display:block;font-size:.66rem;color:rgba(243,236,223,.6);font-weight:600;margin-top:3px}
        .vh-foot{position:absolute;bottom:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px 18px}
        .vh-photo{display:inline-flex;align-items:center;gap:9px;background:rgba(20,16,9,.5);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);color:var(--cream);font-size:.72rem;font-weight:700;padding:9px 16px;border-radius:var(--r-pill);transition:var(--ease)}
        .vh-photo:hover{background:var(--brass);border-color:var(--brass);color:#fff}
        .vh-dots{display:flex;gap:6px}
        .vh-dots button{width:24px;height:4px;border-radius:9px;background:rgba(255,255,255,.25);transition:var(--ease)}
        .vh-dots button.on{background:var(--brass);width:38px}
        .vh-scroll{display:inline-flex;align-items:center;gap:9px;font-size:.68rem;font-weight:700;color:rgba(243,236,223,.6);letter-spacing:.06em}
        .vh-scroll .bar{width:1px;height:34px;background:rgba(255,255,255,.25);position:relative;overflow:hidden}
        .vh-scroll .bar::after{content:'';position:absolute;top:-40%;left:0;right:0;height:40%;background:var(--brass);animation:drop 1.8s infinite}
        @keyframes drop{to{top:110%}}
        @media(min-width:769px){.vh-in>.container{min-height:calc(100svh - 70px);display:flex;flex-direction:column;justify-content:center}}

        /* ============ MARQUEE BAND ============ */
        .band{background:var(--espresso);color:var(--cream);border-top:1px solid rgba(192,138,62,.25);border-bottom:1px solid rgba(192,138,62,.25);overflow:hidden;padding:16px 0;position:relative}
        .band-track{display:flex;gap:44px;white-space:nowrap;animation:bandFlow 30s linear infinite;width:max-content}
        @keyframes bandFlow{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
        .band:hover .band-track{animation-play-state:paused}
        .band-item{display:inline-flex;align-items:center;gap:44px;font-family:var(--display);font-weight:900;font-size:1.35rem;letter-spacing:.01em}
        .band-item i{color:var(--brass);font-size:1rem;font-style:normal}

        /* ============ CHAPTER ============ */
        .chapter{padding:84px 0 30px;position:relative}
        .ch-head{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:end;border-bottom:1.5px solid var(--line);padding-bottom:22px;margin-bottom:36px}
        .ch-num{font-family:var(--display);font-weight:1000;font-size:clamp(3.4rem,7vw,5.6rem);line-height:.85;color:transparent;-webkit-text-stroke:1.6px var(--brass);opacity:.85}
        .ch-title{font-family:var(--display);font-weight:900;font-size:clamp(1.4rem,3.2vw,2.1rem);letter-spacing:-.02em;line-height:1.2}
        .ch-sub{color:var(--muted);font-size:.88rem;margin-top:6px;max-width:60ch}
        .ch-more{display:inline-flex;align-items:center;gap:8px;color:var(--brass-ink);font-weight:800;font-size:.8rem;white-space:nowrap;padding-bottom:8px;transition:var(--ease)}
        .ch-more:hover{gap:14px;color:var(--ink)}
        @media(max-width:768px){.ch-head{grid-template-columns:auto 1fr;gap:14px}.ch-more{display:none}}
        /* ============ SHELF — رف الأقسام التفاعلي ============ */
        .shelf{display:flex;gap:10px;height:460px;overflow:hidden}
        .shelf-panel{position:relative;flex:1;min-width:0;border-radius:20px;overflow:hidden;cursor:pointer;background:var(--espresso2);transition:flex .65s cubic-bezier(.3,.8,.25,1),box-shadow .4s;box-shadow:var(--sh)}
        .shelf-panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9;transition:transform .8s ease,opacity .4s;filter:saturate(.92)}
        .shelf-panel:hover{flex:2.8;box-shadow:var(--sh-lg)}
        .shelf-panel:hover img{transform:scale(1.05);opacity:1}
        .shelf-veil{position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,9,5,.88) 0%,rgba(12,9,5,.15) 55%,rgba(12,9,5,.25) 100%)}
        .shelf-body{position:absolute;right:0;left:0;bottom:0;padding:20px;color:var(--cream)}
        .shelf-idx{font-family:var(--display);font-weight:900;font-size:.7rem;color:var(--brass);letter-spacing:.14em;margin-bottom:6px}
        .shelf-name{font-family:var(--display);font-weight:900;font-size:1.25rem;line-height:1.25;text-shadow:0 2px 14px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .shelf-meta{display:flex;align-items:center;gap:10px;margin-top:8px;max-height:0;opacity:0;overflow:hidden;transition:.5s}
        .shelf-panel:hover .shelf-meta{max-height:60px;opacity:1}
        .shelf-count{font-size:.68rem;font-weight:800;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);padding:3px 11px;border-radius:var(--r-pill);backdrop-filter:blur(6px)}
        .shelf-go{font-size:.7rem;font-weight:800;color:var(--brass);display:inline-flex;gap:6px;align-items:center}
        .shelf-empty{display:grid;place-items:center;flex:1;border:1.5px dashed var(--line2);border-radius:20px;color:var(--muted);background:var(--paper2)}
        @media(max-width:900px){
            .shelf{height:330px}
            .shelf-name{font-size:.95rem}
            .shelf-meta{max-height:60px;opacity:1}
        }
        @media(max-width:640px){
            .shelf{overflow-x:auto;height:300px;scroll-snap-type:x mandatory;padding-bottom:8px}
            .shelf-panel{flex:0 0 190px;scroll-snap-align:center}
            .shelf-panel:hover{flex:0 0 190px}
        }

        /* ============ ARRIVALS RAIL ============ */
        .rail-x{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 16px;scrollbar-width:thin}
        .rail-x::-webkit-scrollbar{height:7px}
        .ar-card{flex:0 0 205px;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:var(--ease);box-shadow:var(--sh)}
        .ar-card:hover{transform:translateY(-6px);box-shadow:var(--sh-lg);border-color:var(--line2)}
        .ar-img{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--paper2)}
        .ar-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.4,0,.2,1)}
        .ar-card:hover .ar-img img{transform:scale(1.08)}
        .ar-badge{position:absolute;top:10px;right:10px;background:var(--espresso);color:var(--cream);font-size:.6rem;font-weight:800;padding:4px 11px;border-radius:var(--r-pill)}
        .ar-badge.off{background:var(--red)}
        .ar-body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:5px}
        .ar-name{font-weight:800;font-size:.85rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--display)}
        .ar-price{font-family:var(--display);font-weight:900;color:var(--brass-ink);font-size:1rem;display:flex;align-items:center;gap:8px}
        .ar-price s{color:var(--muted);font-size:.72rem;font-weight:600}
        .ar-wa{margin-top:4px;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--espresso);color:var(--cream);font-size:.72rem;font-weight:800;padding:9px;border-radius:11px;transition:var(--ease)}
        .ar-wa i{color:var(--wa)}
        .ar-wa:hover{background:#000}

        /* ============ ABOUT — كرت "من نحن" ============ */
        .aboutsec{padding:66px 0 6px;position:relative}
        .about-card{display:grid;grid-template-columns:.92fr 1.08fr;background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--sh-lg);position:relative}
        .about-card::after{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--brass),#e0b570,var(--brass-ink))}
        .about-media{position:relative;min-height:360px;background:linear-gradient(150deg,var(--espresso),#2a2013)}
        .about-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
        .about-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1s ease}
        .about-media::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,rgba(255,255,255,.06))}
        .about-seal{position:absolute;top:18px;right:18px;z-index:3;width:46px;height:46px;border-radius:50%;background:rgba(19,16,11,.55);border:1px solid rgba(224,181,112,.5);backdrop-filter:blur(8px);color:#e0b570;display:flex;align-items:center;justify-content:center;font-size:1.05rem}
        .about-body{padding:44px 46px;display:flex;flex-direction:column;justify-content:center;gap:12px}
